name: Deploy to GitHub Pages

on:
  push:
    branches:
      - master

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inject version info
        run: |
          COMMIT=$(git rev-parse --short HEAD)
          BUILD_DATE=$(date -u +"%Y-%m-%d %H:%M UTC")
          printf 'window.APP_COMMIT = "%s";\nwindow.APP_BUILD_DATE = "%s";\n' "$COMMIT" "$BUILD_DATE" > version.js
          # Browsers only install a new service worker when sw.js itself changes
          # byte-for-byte. version.js is imported by the worker for cache naming,
          # but an unchanged sw.js means Check for update reports "up to date"
          # and cache-first keeps serving the previous shell. Append a build
          # stamp so every Pages deploy produces a detectable SW update.
          printf '\n// Build %s (%s)\n' "$COMMIT" "$BUILD_DATE" >> sw.js

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
